name: Build libopus

# Manual, and on a tag. There is nothing to build on a push: the source is a pinned
# tarball and the flags are in `build.sh`, so a run's output only changes when one of
# those does — which is a commit somebody makes deliberately, followed by a tag.
#
# The manual trigger is not only for reading logs. Windows is the one target that cannot
# be built or tested anywhere else here — Docker covers Linux (`./test-docker.sh`) and a
# Mac covers itself — so `workflow_dispatch` with `targets: windows` *is* the Windows test
# loop, and it is meant to be used before tagging rather than after.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "which targets to build and test"
        type: choice
        default: all
        options: [all, windows, x86_64, arm64]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v5

      # That the committed headers are the pinned opus's, and that src/consts.rs is what
      # those headers say. Cheap, and it runs before six compilers do.
      - run: ./sync-prebuilt.sh --check

      # `v<opus>-<YYYYMMDD>-<short sha>`: the version says what is inside, the date says
      # when, and the hash says *which commit* — because this repository releases for
      # reasons that have nothing to do with opus (a change to the Rust crates, a new CPU
      # floor, a rebuilt archive), and those need a tag of their own rather than an argument
      # about re-tagging v1.6.1.
      #
      # A hash rather than a counter for one reason: nobody has to remember what number
      # they are on, and unlike a counter it can be *checked* — which is the next few lines.
      # Both halves are worth refusing a tag over:
      #
      #   the version, because every asset filename is built from OPUS_VERSION, so
      #   `v1.6.0-…` against a 1.6.1 pin publishes correctly-built archives under a version
      #   they are not, and `--pin` writes that into a consumer's prebuilt.sums as a URL
      #   that does not match the bytes it names;
      #
      #   the hash, because a tag naming a commit other than the one being built is worse
      #   than a tag naming no commit at all — it is provenance that reads as trustworthy
      #   and is not.
      - name: Check the tag names this opus and this commit
        if: github.ref_type == 'tag'
        run: |
          . ./opus.env
          tag="${{ github.ref_name }}"
          version_re="$(printf '%s' "$OPUS_VERSION" | sed 's/\./\\./g')"
          echo "$tag" | grep -Eq "^v${version_re}-[0-9]{8}-[0-9a-f]{7,40}$" || {
            echo "tag $tag is not v${OPUS_VERSION}-<YYYYMMDD>-<short sha>" >&2
            echo "opus.env pins $OPUS_VERSION, and every asset is named for it. Tag with:" >&2
            echo "  git tag v${OPUS_VERSION}-\$(date +%Y%m%d)-\$(git rev-parse --short HEAD)" >&2
            exit 1
          }

          # Compared as a prefix of the full SHA rather than against `git rev-parse --short`:
          # git chooses an abbreviation length from the object count, so the length here need
          # not match the length on the machine that made the tag.
          short="${tag##*-}"
          case "$GITHUB_SHA" in
            "$short"*) echo "$tag names opus $OPUS_VERSION at $GITHUB_SHA" ;;
            *)
              echo "tag $tag says commit $short but this run is building $GITHUB_SHA" >&2
              exit 1
              ;;
          esac

      # The matrix, narrowed here as *data* rather than by a job-level `if`. Two reasons,
      # one hard and one practical: a job-level condition cannot reference `matrix` at all
      # — GitHub rejects the workflow outright — and filtering before the fan-out means a
      # `targets: windows` dispatch starts two runners instead of six.
      #
      # `features` is spelled out even where it is empty, so `${{ matrix.features }}` is
      # always a defined key rather than a silent blank.
      - id: matrix
        env:
          GROUP: ${{ inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"macos-arm64",                 "runs-on":"macos-latest",   "group":"arm64",   "features":""},
            {"target":"linux-x86_64",                "runs-on":"ubuntu-24.04",   "group":"x86_64",  "features":""},
            {"target":"linux-x86_64-baseline",       "runs-on":"ubuntu-24.04",   "group":"x86_64",  "features":"--features opus-prebuilt/x86-baseline"},
            {"target":"linux-aarch64",               "runs-on":"ubuntu-24.04-arm","group":"arm64",  "features":""},
            {"target":"windows-x86_64-msvc",         "runs-on":"windows-latest", "group":"windows", "features":""},
            {"target":"windows-x86_64-msvc-baseline","runs-on":"windows-latest", "group":"windows", "features":"--features opus-prebuilt/x86-baseline"}
          ]'
          # A tag always builds everything: a release missing an asset is a build failure
          # for whoever needs that target, discovered later and by somebody else.
          [ "${{ github.event_name }}" = workflow_dispatch ] || GROUP=all
          targets="$(jq -c --arg g "$GROUP" '[.[] | select($g == "all" or .group == $g)]' <<<"$all")"
          echo "$targets" | jq -r '.[].target' | sed 's/^/  /'
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      # No fail-fast: one target failing to configure is exactly the case where the other
      # five logs are the useful comparison.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # bash on the Windows runner too, so one script covers every target. cmake is
      # preinstalled on all three images.
      - name: Build ${{ matrix.target }}
        shell: bash
        run: ./build.sh ${{ matrix.target }}

      # The half of the artifact the archive alone does not cover: whether Rust can *link*
      # it. That is what has broken before — a CRT mismatch, an `opus.lib` under a name
      # nobody expected, an `.a` for the wrong ABI — and none of it shows up in a
      # successful cmake run. `--offline`, after sync-prebuilt.sh, also demonstrates the
      # claim consumers care about: once the archive exists, no build needs a network.
      - name: Link and test against it
        shell: bash
        run: |
          ./sync-prebuilt.sh
          cargo test --offline --workspace ${{ matrix.features }}

      # The end-to-end leg: a release binary that is a *consumer* of the crate, executed
      # on the runner's own processor. This is where the CPU floor stops being a claim in a
      # MANIFEST — an AVX2 archive that cannot run fails here — and it is the only place
      # Windows gets exercised at all, since neither Docker nor a Mac can do it.
      - name: End to end — encode and decode in a real binary
        shell: bash
        run: |
          cargo build --offline --release --workspace ${{ matrix.features }}
          bin=target/release/opus-e2e
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin"
          ./check-static.sh "$bin"
          # A fingerprint of the encoder's *output*, compared across CPU floors by the
          # `floors` job below.
          mkdir -p digest
          "$bin" --digest | tee "digest/digest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digest/digest.txt
          if-no-files-found: error

      - name: Show what was built
        shell: bash
        run: cat dist/${{ matrix.target }}/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: libopus-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  # Does raising the x86_64 floor change what the encoder *emits*?
  #
  # It is a fair question and it has a real consequence: a project with checked-in Opus
  # fixtures needs to know whether its fixtures still match after the switch, and
  # "probably, opus is stable" is not something anybody can act on. So the two archives
  # that differ *only* in CPU floor encode the same input under pinned settings, and their
  # digests are compared. Measured answer, at the time of writing: identical.
  #
  # It is an assertion rather than a printout because of what a future divergence would
  # mean. If an opus bump or a flag change ever makes the floors disagree, whoever made
  # that change has to tell consumers to re-run their encoder tests — and a line in a log
  # nobody reads is not how that gets communicated.
  floors:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests

      - name: Compare the CPU floors
        run: |
          shopt -s nullglob
          for dir in digests/digest-*; do
            echo "== ${dir#digests/digest-}"
            sed 's/^/   /' "$dir/digest.txt"
          done

          status=0
          compared=0
          # Same OS, same architecture, same compiler — only the floor differs. Comparing
          # across architectures would be a different and much weaker claim, since libopus
          # does not promise identical float output between, say, NEON and AVX2.
          for pair in "linux-x86_64 linux-x86_64-baseline" \
                      "windows-x86_64-msvc windows-x86_64-msvc-baseline"; do
            set -- $pair
            a="digests/digest-$1/digest.txt"
            b="digests/digest-$2/digest.txt"
            # A narrowed dispatch (`targets: arm64`) legitimately has no pair to compare.
            if [ ! -f "$a" ] || [ ! -f "$b" ]; then
              echo "-- skipped $1 vs $2: not both built in this run"
              continue
            fi
            compared=$((compared + 1))
            da="$(awk '$1=="digest"{print $2}' "$a")"
            db="$(awk '$1=="digest"{print $2}' "$b")"
            if [ "$da" = "$db" ]; then
              echo "ok   $1 and $2 encode byte-identically ($da)"
            else
              echo "DIFF $1=$da  $2=$db"
              echo "     Raising the CPU floor changed the encoder's output. This is not"
              echo "     necessarily a bug, but every consumer with pinned Opus fixtures"
              echo "     has to re-generate them, and the README has to say so." >&2
              status=1
            fi
          done
          # Reported, not asserted: which targets happen to agree. Measured today, the
          # encoder is stable within an architecture across OS and compiler — GCC on Linux
          # and MSVC on Windows produce the same bytes — and differs between x86_64 and
          # aarch64, which is two sets of hand-written SIMD kernels doing float arithmetic.
          # That is a fact consumers with pinned fixtures need, but a runner image changing
          # its compiler is something to notice rather than something to fail a build on.
          echo
          echo "digest groups (informational):"
          for dir in digests/digest-*; do
            printf '%s %s\n' "$(awk '$1=="digest"{print $2}' "$dir/digest.txt")" "${dir#digests/digest-}"
          done | sort | awk '{ g[$1] = g[$1] " " $2 } END { for (d in g) print "  " d ":" g[d] }'

          echo
          echo "$compared floor pair(s) compared"
          exit $status

  release:
    # Only a tag publishes. A `workflow_dispatch` run is for testing a target.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One archive per target, plus one checksum file over all of them. A consumer
      # verifies what it downloaded against this rather than trusting the transfer —
      # including crates/libopus-prebuilt-sys/build.rs, which checks a downloaded asset
      # against the copy of these sums that `./sync-prebuilt.sh --pin` commits.
      - name: Package
        run: |
          mkdir -p dist
          . ./opus.env
          for dir in artifacts/libopus-*; do
            target="${dir#artifacts/libopus-}"
            tar czf "dist/libopus-${OPUS_VERSION}-${target}.tar.gz" -C "$dir" .
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./opus.env
          # The build stamp is whatever the tag says after the version, so the title reads
          # "libopus 1.6.1 static archives - 20260730-1" and two releases of the same opus
          # are told apart at a glance in the release list.
          stamp="${GITHUB_REF_NAME#v${OPUS_VERSION}-}"
          gh release create "${{ github.ref_name }}" dist/* \
            --title "libopus ${OPUS_VERSION} static archives - ${stamp}" \
            --notes "Static libopus ${OPUS_VERSION} for macos-arm64, linux-x86_64, \
          linux-aarch64 and windows-x86_64-msvc, with the SIMD paths and the CPU floor \
          verified at build time. The x86_64 targets are built twice: once for a Coffee \
          Lake floor (AVX2 unconditional) and once as \`-baseline\` (SSE2, with CPUID \
          dispatch at runtime). See README.md.

          Rust consumers: run \`./sync-prebuilt.sh --pin ${{ github.ref_name }}\`, commit \
          the result, and depend on \`opus-prebuilt\` at that commit."
