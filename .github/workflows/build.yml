name: Build libopus

# Manual, and on a tag. There is nothing to build on a push: the source is a pinned
# tarball and the flags are in `build.sh`, so a run's output only changes when one of
# those does — which is a commit somebody makes deliberately, followed by a tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # No fail-fast: one target failing to configure is exactly the case where the
      # other three logs are the useful comparison.
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-latest
            library: libopus.a
          - target: linux-x86_64
            runs-on: ubuntu-24.04
            library: libopus.a
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            library: libopus.a
          - target: windows-x86_64-msvc
            runs-on: windows-latest
            library: opus.lib
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # bash on the Windows runner too, so one script covers every target. cmake is
      # preinstalled on all four images.
      - name: Build ${{ matrix.target }}
        shell: bash
        run: ./build.sh ${{ matrix.target }}

      - name: Show what was built
        shell: bash
        run: cat dist/${{ matrix.target }}/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: libopus-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  release:
    # Only a tag publishes. A `workflow_dispatch` run is for looking at the logs.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One archive per target, plus one checksum file over all of them. A consumer
      # verifies what it downloaded against this rather than trusting the transfer.
      - name: Package
        run: |
          mkdir -p dist
          . ./opus.env
          for dir in artifacts/libopus-*; do
            target="${dir#artifacts/libopus-}"
            tar czf "dist/libopus-${OPUS_VERSION}-${target}.tar.gz" -C "$dir" .
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./opus.env
          gh release create "${{ github.ref_name }}" dist/* \
            --title "libopus ${OPUS_VERSION} (${{ github.ref_name }})" \
            --notes "Static libopus ${OPUS_VERSION} for linux-x86_64, linux-aarch64, macos-arm64 and windows-x86_64-msvc, with SIMD verified at build time. See README.md for how to consume it."
