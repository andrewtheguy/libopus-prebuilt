name: CI

# On every push and pull request, unlike build.yml and release.yml, which are manual.
#
# The distinction is what changes commit to commit. The *archives* change only when
# opus.env or build.sh does — a deliberate act, followed by a deliberate `build.yml` run —
# so rebuilding six of them on every push would be six runners proving that a pinned
# tarball is still pinned. The *Rust crates and the shell scripts* change constantly, and
# until now nothing checked them unless somebody remembered to press a button; a bash 3.2
# incompatibility in build.sh reached a commit for exactly that reason.
#
# So: one x86_64 pair rather than all six targets, plus the two checks that need no
# compiler, plus the one path a normal build here never takes.
on:
  push:
    # Documentation cannot break a build, and a README-only commit should not spend a
    # runner proving it.
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        # `-x` so that `. ./opus.env` and `. ./source.sh` are followed rather than reported
        # as unresolvable.
        run: |
          shellcheck -x build.sh sync-prebuilt.sh test-docker.sh check-static.sh \
                        crates/libopus-prebuilt-sys/gen-consts.sh

  # A separate job on macOS for one reason: its `/bin/bash` is 3.2, from 2007, and that is
  # what a stock Mac runs. shellcheck accepts bash-5-only constructs happily, and
  # `$(case … esac)` — legal in bash 4+, a syntax error in 3.2 — is how build.sh broke on
  # the macOS runner while passing on every other target and on a Mac with Homebrew's bash
  # earlier in PATH. Parsing is enough to catch that class of bug, and it costs seconds.
  stock-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every script with the bash a stock Mac ships
        run: |
          /bin/bash --version | head -1
          /bin/bash -n build.sh source.sh sync-prebuilt.sh test-docker.sh check-static.sh \
                       crates/libopus-prebuilt-sys/gen-consts.sh
          echo "every script parses under bash $(/bin/bash -c 'echo $BASH_VERSION')"

  # The real gate: build an archive, link the crates against it, run the tests and the
  # end-to-end binary. x86_64 rather than arm64 because it is the target whose floor is a
  # deliberate exclusion — a wrong answer there is an illegal instruction on somebody's
  # machine, where on arm64 it would only be a slower library.
  #
  # Calling build.yml rather than repeating it means CI, the manual test loop and the
  # release all exercise the same code, with no CI-only build to drift.
  archives:
    uses: ./.github/workflows/build.yml
    with:
      targets: x86_64

  # Is the library reproducible? The `archives` job above built one on its own runner; this
  # builds the same target again, on a different runner, and requires the two `libopus.a`
  # files to be **byte-identical**.
  #
  # That is the checksum that actually means something. The `.tar.gz` around it is not
  # reproducible — gzip stamps an mtime into its header — so SHA256SUMS and prebuilt.sums
  # can only ever say "these are the bytes that were published", which is what a download
  # needs and no more. This says the stronger thing: the same source and the same flags
  # produce the same library, so a change in it is a change somebody made.
  #
  # Two independent runners rather than two builds on one, because a compiler that embeds a
  # path, a timestamp or a hostname would pass the second and fail this.
  reproducible:
    needs: archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild linux-x86_64
        run: ./build.sh linux-x86_64

      - name: Download the archive the other runner built
        uses: actions/download-artifact@v4
        with:
          name: libopus-linux-x86_64
          path: theirs

      - name: The two must be byte-identical
        run: |
          mine="$(sha256sum dist/linux-x86_64/lib/libopus.a | awk '{print $1}')"
          theirs="$(sha256sum theirs/lib/libopus.a | awk '{print $1}')"
          echo "  this runner: $mine"
          echo "  the other:   $theirs"
          # Also against what the other runner recorded for itself, which catches a MANIFEST
          # that disagrees with the file shipped beside it.
          recorded="$(awk '$1=="sha256(library)"{print $2}' theirs/MANIFEST)"
          [ "$recorded" = "$theirs" ] || {
            echo "::error::MANIFEST says $recorded but the archive hashes to $theirs"
            exit 1
          }
          [ "$mine" = "$theirs" ] || {
            echo "::error::the same commit produced two different libraries on two runners"
            exit 1
          }
          echo "  reproducible: same source, same flags, same library"

  # Leak checking on the one platform that has `leaks` — macOS. The other two legs of this
  # live elsewhere: valgrind runs under `test-docker.sh` on Linux, and the e2e binary's own
  # RSS churn test runs on all four targets, Windows included.
  #
  # `leaks` rather than a Rust allocator hook, because libopus allocates with C `malloc`.
  # A `GlobalAlloc` counter sees only Rust-side allocation and would report a clean run
  # however badly the handles leaked — which is why the control below is not optional.
  leaks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # No local build: fetching the release archive is faster than compiling libopus, and
      # it is the artifact consumers actually link.
      - name: Build the e2e binary
        run: cargo build --release -p opus-e2e

      - name: No leaks
        env:
          # Required, not tidiness. The binary's own RSS check leaks 1200 handles on purpose
          # as *its* control, so without this `leaks` reports 31 MB and the job fails on a
          # leak the test deliberately created. Turning that section off leaves the exact
          # tool doing the measuring, which is the better instrument anyway.
          OPUS_E2E_MEMORY: "off"
        run: |
          # --atExit runs the process to completion and inspects it just before it dies,
          # which is the only moment a leak is distinguishable from memory still in use.
          MallocStackLogging=1 leaks --atExit -- ./target/release/opus-e2e >leaks.log 2>&1 \
            || { grep -E 'leaks for|Leak:' leaks.log | head -20; exit 1; }
          grep -E 'leaks for' leaks.log

      - name: And the control — a deliberate leak must be caught
        run: |
          # If this passes, the check above proves nothing: it would mean `leaks` cannot
          # see libopus's allocations, and a clean report is a blind one.
          if MallocStackLogging=1 leaks --atExit -- \
               ./target/release/opus-e2e --leak-only >control.log 2>&1; then
            echo "::error::leaks did not notice 60 forgotten libopus handles"
            exit 1
          fi
          grep -E 'leaks for' control.log

  # The one path nothing else takes. Every other job populates `prebuilt/` from a local
  # build first, which means build.rs's third resolution step — download the asset, check it
  # against the release's SHA256SUMS, unpack it, hash the library against its MANIFEST — is
  # what every *consumer's* first build does and the one thing building here never
  # exercises. This job leaves prebuilt/ empty on purpose and lets it fetch.
  consumer-fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build as a consumer does, with nothing prebuilt locally
        run: |
          # No ./build.sh and no ./sync-prebuilt.sh. This is a clone with an empty
          # prebuilt/, which is the state every consuming project is in.
          cargo build -vv --release 2>&1 | tee build.log | tail -5
          grep -oE 'cargo:info=libopus.*' build.log | sort -u

          # Which source satisfied the link, asserted rather than assumed: if a stray
          # archive or a system libopus had satisfied it, this job would pass while testing
          # nothing at all.
          grep -q 'linked statically from latest release asset' build.log || {
            echo "::error::the archive did not come from the release"
            exit 1
          }

          # And that both integrity checks ran. A verification that silently stops running
          # is worse than one that was never written, because the log still looks right —
          # so the log is what gets checked.
          for claim in 'matches SHA256SUMS' 'matches the MANIFEST'; do
            grep -q "$claim" build.log || {
              echo "::error::build.rs did not report '$claim' — the check did not run"
              exit 1
            }
          done
          echo "download and archive both verified"

      - name: Test and run the binary it fetched
        run: |
          cargo test --workspace --release
          ./target/release/opus-e2e
          ./check-static.sh target/release/opus-e2e
